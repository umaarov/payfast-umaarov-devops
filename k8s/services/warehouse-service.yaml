apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-service
  labels:
    app.kubernetes.io/name: warehouse-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warehouse-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warehouse-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: warehouse-service
      containers:
        - name: warehouse-service
          image: ghcr.io/umaarov/logistics-warehouse-service
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: WAREHOUSE_DB_URL
              value: "jdbc:postgresql://postgres:5432/warehouse"
            - name: WAREHOUSE_DB_USER
              value: "warehouse"
            - name: WAREHOUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: WAREHOUSE_DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-service
  labels:
    app.kubernetes.io/name: warehouse-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: warehouse-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: warehouse-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warehouse-service
