server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: warehouse-service
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:postgresql://localhost:5432/warehouse}
    username: ${WAREHOUSE_DB_USER:warehouse}
    password: ${WAREHOUSE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info
