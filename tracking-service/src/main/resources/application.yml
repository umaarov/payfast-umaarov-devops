server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: tracking-service
  datasource:
    url: ${TRACKING_DB_URL:jdbc:postgresql://localhost:5432/tracking}
    username: ${TRACKING_DB_USER:tracking}
    password: ${TRACKING_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
