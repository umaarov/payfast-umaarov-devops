name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test all modules
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked environment files
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "Environment files must not be tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" gitleaks

      - name: Scan the git history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

      - name: Scan the working tree
        run: ./gitleaks dir --config .gitleaks.toml --redact --no-banner --verbose .

  kubernetes-manifests:
    name: kubernetes-manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that both copies of the database init script are identical
        run: cmp docker/postgres/init-databases.sh k8s/postgres/init-databases.sh

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: 0.8.0
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          archive="kubeconform-linux-amd64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o CHECKSUMS "$base/CHECKSUMS"
          grep " ${archive}\$" CHECKSUMS | sha256sum --check -
          tar -xzf "$archive" kubeconform

      - name: Render and validate the manifests
        run: kubectl kustomize k8s | ./kubeconform -strict -summary -kubernetes-version 1.31.0 -

      - name: Reject Secret objects in the manifests
        run: |
          if kubectl kustomize k8s | grep -E '^kind: Secret$'; then
            echo "Secrets must be created in the cluster, not committed"
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan dependencies and configuration
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create the environment file
        run: sh scripts/init-env.sh

      - name: Build the images and start the stack
        run: docker compose up --build -d --wait --wait-timeout 600

      - name: Run the smoke test
        run: sh scripts/smoke-test.sh

      - name: Scan the order-service image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: logistics/order-service:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
