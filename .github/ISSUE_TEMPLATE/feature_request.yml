name: Feature request
description: A new capability for customers, couriers, or operators
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <customer | dispatcher | courier | warehouse operator>, I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] given ... when ... then ...
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API or data impact
      description: New or changed endpoints, events, and database tables.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - blocks the sprint goal
        - P1 - important
        - P2 - nice to have
    validations:
      required: true
